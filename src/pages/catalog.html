<!-- ================= CATALOG ================= -->
<div class="page" id="page-catalog">
  <section style="padding-top:32px;">
    <div class="wrap">
      <div class="section-head">
        <h2>Каталог</h2>
        <p>Каталог оформлений у єдиному стилі Dymok. Актуальна наявність оновлюється на сайті.</p>
      </div>
      <div class="toolbar">
        <input class="search" id="search" type="text" placeholder="Пошук за назвою чи брендом...">
        <select class="sortsel" id="sort">
          <option value="default">Сортування</option>
          <option value="price-asc">Ціна: спочатку дешевші</option>
          <option value="price-desc">Ціна: спочатку дорожчі</option>
          <option value="name">За назвою</option>
        </select>
      </div>
      <div class="catalog-note">⚡ Актуальна наявність може змінюватися. Під час оформлення сервер перевірить доступну кількість.</div>
      <div class="win" id="win">
        <div class="win-head">
          <button type="button" class="win-back" id="winBack" aria-label="Назад на один крок">← Назад</button>
          <div class="win-steps" id="winSteps" aria-live="polite"></div>
        </div>
        <nav class="crumbs" id="crumbs" aria-label="Шлях у каталозі"></nav>
        <div class="win-body" id="catView"></div>
      </div>
    </div>
  </section>
  <section>
    <div class="wrap">
      <div class="trust">
        <div class="badge">✅ Тільки оригінальний товар</div>
        <div class="badge">🔒 Конфіденційна упаковка</div>
        <div class="badge">🚚 Доставка по всій Україні</div>
        <div class="badge">🔞 Продаж лише 18+</div>
      </div>
    </div>
  </section>
</div>
